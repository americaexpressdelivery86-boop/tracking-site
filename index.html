<!DOCTYPE html>
<html>
<head>
<title>Universal Tracker</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
}
input, button {
    padding: 10px;
    margin: 5px;
}
.result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>
<body>

<h1>Universal Tracker</h1>
<p>Enter your tracking number below:</p>

<input type="text" id="trackingNumber" placeholder="Tracking Number">
<button onclick="trackPackage()">Track</button>

<div class="result" id="result"></div>

<script>
function trackPackage() {
    const tracking = document.getElementById("trackingNumber").value;

  else if (tracking === "TRK999999") {
    document.getElementById("result").innerHTML =
    "📦 Status: Arrived at Local Facility<br>Location: Phoenix, Arizona";
}
    } else if (tracking === "TRK654321") {
        document.getElementById("result").innerHTML =
        "🚚 Status: Out for Delivery";
    } else {
        document.getElementById("result").innerHTML =
        "❌ Tracking number not found.";
    }
}
</script>

</body>
</html>
